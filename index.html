<style>
  :root{
    --bg: #efe9e0;
    --card: #faf7f1;
    --card-soft: #f4efe6;
    --ink: #4a4339;
    --ink-soft: #8c8375;
    --ink-faint: #b3a99a;
    --line: #ddd3c1;

    --sage: #7f9a68;
    --sage-deep: #56704a;
    --sage-soft: #e2ead7;
    --sage-wash: #eef2e7;

    --clay: #c07953;
    --clay-deep: #9c5636;
    --clay-soft: #f5e0d2;
    --clay-wash: #faeee5;

    --slate: #5f8791;
    --slate-deep: #3f6169;
    --slate-soft: #dbe7ea;
    --slate-wash: #ebf1f2;

    --gold: #bd8535;
    --gold-soft: #f2e6cd;
    --shadow: 0 6px 24px rgba(74,67,57,0.08), 0 1px 3px rgba(74,67,57,0.06);
  }

  *{ box-sizing: border-box; }

  html, body{ max-width: 100%; overflow-x: hidden; }

  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #f4efe6 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, #eee6d8 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 720px; margin: 0 auto; padding: 40px 20px 120px; }

  /* ---------- Header ---------- */
  header.top{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom: 28px; padding-bottom: 18px; border-bottom: 1px solid var(--line);
  }
  .brand-row .mark{
    font-family:"Cormorant Garamond", serif; font-style:italic; font-size:17px;
    color: var(--gold); letter-spacing:0.06em;
  }
  h1.title{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:29px; margin:-18px 0 24px; letter-spacing:0.08em; color: var(--gold); }
  .top-actions{ display:flex; gap: 10px; }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
    background: var(--card); color: var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: all .2s ease; font-size:17px;
  }
  .icon-btn:hover{ border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }
  .icon-btn.logged-in{ padding:0; overflow:hidden; }
  .icon-btn.logged-in img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .cloud-status{ text-align:center; font-size:11.5px; color: var(--ink-faint); margin: -18px 0 20px; letter-spacing:0.05em; }
  .cloud-status.on{ color: var(--sage-deep); }
  #manualSyncLink{ color: var(--gold); cursor:pointer; text-decoration:underline; }
  #importFile{ display:none; }

  /* ---------- Filters row ---------- */
  .filter-row{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin-bottom: 10px; flex-wrap:wrap;
  }
  .month-nav{ display:flex; align-items:center; gap: 22px; }
  .month-nav button{
    background:none; border:none; font-size:20px; color: var(--ink-faint);
    cursor:pointer; padding:6px 10px; transition: color .2s;
  }
  .month-nav button:hover{ color: var(--gold); }
  .month-label{ font-family:"Noto Serif TC", serif; font-size:21.5px; font-weight:600; letter-spacing:0.12em; min-width: 140px; text-align:center; color: var(--slate-deep); }
  .acct-filter select{
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 7px 10px; font-size: 14px; color: var(--ink-soft); font-family:"Noto Sans TC",sans-serif;
  }

  /* ---------- Summary ---------- */
  .summary{ display:grid; grid-template-columns: 1fr 1fr 1.1fr; gap:12px; margin-bottom: 14px; }
  .sum-card{ background: var(--card); border-radius: 14px; padding: 18px 16px; box-shadow: var(--shadow); position:relative; overflow:hidden; }
  .sum-card .label{ font-size:13.5px; letter-spacing:0.15em; color: var(--ink-soft); margin-bottom:8px; }
  .sum-card .num{ font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; font-size: 29px; font-weight:700; }
  .sum-card.income{ background: var(--sage-soft); }
  .sum-card.income .label{ color: var(--sage-deep); opacity:0.8; }
  .sum-card.income .num{ color: var(--sage-deep); }
  .sum-card.expense{ background: var(--clay-soft); }
  .sum-card.expense .label{ color: var(--clay-deep); opacity:0.8; }
  .sum-card.expense .num{ color: var(--clay-deep); }
  .sum-card.balance{ background: linear-gradient(135deg, var(--card) 55%, var(--gold-soft)); }
  .sum-card.balance::after{ content:""; position:absolute; right:-18px; top:-18px; width:70px; height:70px; border-radius:50%; border:1px dashed var(--gold); opacity:0.5; }
  .sum-card.balance .num{ color: var(--gold); }
  .cny::before{ content:"NT$ "; font-size:14.5px; opacity:0.6; }

  .fx-summary{ margin-bottom: 22px; }
  .fx-chip{
    display:inline-flex; align-items:center; gap:5px; font-size:13px;
    background: var(--card-soft); color: var(--ink-soft); border-radius: 8px;
    padding: 4px 9px; margin: 0 6px 6px 0;
  }
  .fx-chip b{ color: var(--ink); font-weight:500; }

  /* ---------- Accounts overview ---------- */
  .accounts-title{ font-family:"Noto Serif TC", serif; font-size:15.5px; letter-spacing:0.12em; color: var(--ink-soft); margin: 6px 4px 12px; display:flex; justify-content:space-between; align-items:center; }
  .accounts-title .edit-link{ font-size:13px; color: var(--gold); cursor:pointer; letter-spacing:0.03em; }
  .acct-groups{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
  @media (max-width: 480px){ .acct-groups{ grid-template-columns: 1fr; } }
  .acct-group-card{ background: var(--card); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .acct-group-card h4{ margin:0 0 8px; font-size:13px; letter-spacing:0.12em; color: var(--ink-faint); font-weight:500; }
  .acct-line{ display:flex; justify-content:space-between; align-items:baseline; padding: 5px 0; font-size:14.5px; border-bottom: 1px dashed var(--line); }
  .acct-line:last-child{ border-bottom:none; }
  .acct-line .a-name{ color: var(--ink); }
  .acct-line .a-amt{ font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; font-weight:700; font-size:16.5px; }
  .acct-line .a-amt.asset{ color: var(--sage-deep); }
  .acct-line .a-amt.liability{ color: var(--clay-deep); }
  .version-note{ text-align:center; margin-top: 34px; font-size:11px; color: var(--ink-faint); letter-spacing:0.03em; }

  /* ---------- Calculator keypad ---------- */
  .calc-wrap{ margin: -8px 0 18px; }
  .calc-preview{
    text-align:right; font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    font-size:15px; font-weight:700; color: var(--gold); min-height:20px; padding: 0 4px 8px;
  }
  .calc-keypad{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
  .calc-key{
    border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 0;
    font-size:16px; font-family:"Noto Sans TC",sans-serif; color: var(--ink); cursor:pointer;
    transition: all .15s ease;
  }
  .calc-key:hover{ border-color: var(--gold); background: var(--card-soft); }
  .calc-key:active{ transform: scale(0.95); }
  .calc-key.op{ background: var(--slate-soft); color: var(--slate-deep); border-color: transparent; font-weight:600; font-size:17px; }
  .acct-line .a-amt.warning{ color: var(--clay-deep); background: var(--clay-soft); padding:2px 8px; border-radius:8px; font-size:14px; }
  .warning-inline{ color: var(--clay-deep); font-weight:700; }
  .acct-line .a-sub{ font-size:12px; color: var(--ink-faint); display:block; text-align:right; }

  /* ---------- Breakdown ---------- */
  .breakdown{ display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 34px; }
  .bd-card{ background: var(--card); border-radius: 14px; padding: 18px 18px 12px; box-shadow: var(--shadow); }
  .bd-card.income{ background: var(--sage-soft); }
  .bd-card.expense{ background: var(--clay-soft); }
  .bd-card h3{ font-family:"Noto Serif TC", serif; font-size:15.5px; font-weight:600; letter-spacing:0.1em; margin: 0 0 12px; display:flex; align-items:center; gap:6px; }
  .bd-card h3 .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .bd-card.income h3{ color: var(--sage-deep); }
  .bd-card.income h3 .dot{ background: var(--sage); }
  .bd-card.expense h3{ color: var(--clay-deep); }
  .bd-card.expense h3 .dot{ background: var(--clay); }
  .bd-row{ margin-bottom: 10px; }
  .bd-row .r-top{ display:flex; justify-content:space-between; font-size:14px; color: var(--ink-soft); margin-bottom:4px; }
  .bd-row .r-top b{ color: var(--ink); font-weight:500; }
  .bar-track{ height:5px; background: var(--card-soft); border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:3px; transition: width .5s ease; }
  .income .bar-fill{ background: var(--sage); }
  .expense .bar-fill{ background: var(--clay); }
  .bd-empty{ color: var(--ink-faint); font-size:14px; padding: 10px 0; font-style: italic; }

  /* ---------- Transaction list ---------- */
  .list-title{ font-family:"Noto Serif TC", serif; font-size:15.5px; letter-spacing:0.12em; color: var(--ink-soft); margin: 6px 4px 12px; }

  /* ---------- New: section cards (monthly history / category trend) ---------- */
  .section-card{ margin: 30px 0; }
  .section-title{ font-family:"Noto Serif TC", serif; font-size:15.5px; letter-spacing:0.12em; color: var(--ink-soft); }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; padding: 4px; margin-bottom: 4px;
  }
  .toggle-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font-size:16px; line-height:1;
    cursor:pointer; transition: all .2s ease; flex-shrink:0;
  }
  .toggle-btn:hover{ border-color: var(--gold); color: var(--gold); }
  .toggle-btn.open{ transform: rotate(45deg); }
  .section-body{ margin-top: 14px; }

  .mh-row{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--card); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(74,67,57,0.05);
  }
  .mh-row .mh-month{ font-family:"Noto Serif TC", serif; font-size:14px; letter-spacing:0.06em; }
  .mh-row .mh-nums{ display:flex; gap:16px; font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; font-weight:700; font-size:14px; }
  .mh-row .mh-in{ color: var(--sage-deep); }
  .mh-row .mh-out{ color: var(--clay-deep); }
  .mh-row .mh-bal{ color: var(--gold); }
  .mh-row.mh-header{ background:none; box-shadow:none; padding: 4px 16px; margin-bottom:2px; }
  .mh-row.mh-header .mh-month{ color: var(--ink-faint); font-size:11.5px; letter-spacing:0.08em; font-family:"Noto Sans TC",sans-serif; }
  .mh-row.mh-header .mh-nums span{ color: var(--ink-faint) !important; font-size:11.5px; font-weight:500; letter-spacing:0.05em; }
  .mh-row .mh-nums{ min-width: 210px; justify-content:space-between; }
  .mh-row .mh-nums span{ min-width: 60px; text-align:right; }
  .mh-empty{ color: var(--ink-faint); font-size:13px; padding: 10px 4px; font-style:italic; }

  .trend-controls{ display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .trend-controls .type-tabs{ width: 160px; margin-bottom:0; }
  .trend-controls select{
    flex:1; min-width:140px; border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:9px 12px; font-size:13.5px; font-family:"Noto Sans TC",sans-serif; color: var(--ink);
  }
  .trend-empty{
    text-align:center; color: var(--ink-faint); font-size:13px; font-style:italic; padding: 40px 10px;
    background: var(--card); border-radius:14px; box-shadow: var(--shadow);
  }
  .trend-chart-card{ background: var(--card); border-radius:14px; padding:20px 16px 14px; box-shadow: var(--shadow); }
  .trend-total{ text-align:center; font-size:12.5px; color: var(--ink-soft); margin-top:6px; letter-spacing:0.04em; }
  .day-group{ margin-bottom: 18px; }
  .day-head{ display:flex; align-items:center; gap:10px; color: var(--ink-faint); font-size:13.5px; letter-spacing:0.08em; margin: 0 4px 8px; }
  .day-head .line{ flex:1; height:1px; background: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px); }

  .tx-card{
    background: var(--card); border-radius: 12px; padding: 13px 16px;
    display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(74,67,57,0.05); border-left: 3px solid var(--line);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .tx-card:hover{ transform: translateX(2px); box-shadow: var(--shadow); }
  .tx-card.income{ background: var(--sage-wash); border-left-color: var(--sage); }
  .tx-card.expense{ background: var(--clay-wash); border-left-color: var(--clay); }
  .tx-card.transfer{ background: var(--slate-wash); border-left-color: var(--slate); }

  .tx-left{ display:flex; align-items:flex-start; gap:10px; }
  .tx-check{
    margin-top:3px; width:16px; height:16px; border-radius:5px; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    color: transparent; font-size:12.5px; transition: all .15s;
  }
  .tx-check.checked{ background: var(--gold); border-color: var(--gold); color:#fff; }
  .tx-text{ display:flex; flex-direction:column; gap:3px; }
  .tx-cat{ font-size:16px; font-weight:500; }
  .tx-note{ font-size:13.5px; color: var(--ink-faint); }
  .tx-acct{ font-size:12.5px; color: var(--ink-faint); }
  .tx-tag{ display:inline-block; font-size:12px; padding:1px 7px; border-radius: 8px; margin-right:6px; letter-spacing:0.05em; }
  .tx-card.income .tx-tag{ background: var(--sage-soft); color: var(--sage-deep); }
  .tx-card.expense .tx-tag{ background: var(--clay-soft); color: var(--clay-deep); }
  .tx-card.transfer .tx-tag{ background: var(--slate-soft); color: var(--slate-deep); }

  .tx-right{ display:flex; align-items:center; gap:10px; }
  .tx-amt{ font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; font-size:20.5px; font-weight:700; }
  .tx-card.income .tx-amt{ color: var(--sage-deep); }
  .tx-card.expense .tx-amt{ color: var(--clay-deep); }
  .tx-card.transfer .tx-amt{ color: var(--slate-deep); }
  .tx-del{ background:none; border:none; color: var(--ink-faint); cursor:pointer; font-size:18px; opacity:0; transition: opacity .15s; padding: 2px 4px; }
  .tx-card:hover .tx-del{ opacity:1; }
  .tx-del:hover{ color: var(--clay-deep); }

  .empty-state{ text-align:center; padding: 50px 20px; color: var(--ink-faint); }
  .empty-state .mark{ font-family:"Cormorant Garamond", serif; font-style:italic; font-size:24.5px; display:block; margin-bottom:8px; }

  /* ---------- Floating add button ---------- */
  .fab{
    position:fixed; right: 28px; bottom: 28px; width:62px; height:62px; border-radius:50%;
    background: var(--ink); color: var(--bg); border:none; font-size:29px; font-weight:300;
    cursor:pointer; box-shadow: 0 10px 26px rgba(74,67,57,0.28);
    display:flex; align-items:center; justify-content:center; transition: transform .2s ease; z-index: 50;
  }
  .fab:hover{ transform: scale(1.06) rotate(90deg); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background: rgba(74,67,57,0.35); backdrop-filter: blur(2px);
    display:none; align-items:flex-end; justify-content:center; z-index: 100;
  }
  .modal-overlay.open{ display:flex; }
  @media (min-width: 640px){ .modal-overlay{ align-items:center; } }

  .modal{
    background: var(--card); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 26px 24px 28px; box-shadow: 0 -10px 40px rgba(74,67,57,0.25);
    max-height: 88vh; overflow-y:auto; animation: slideUp .25s ease; position:relative;
  }
  @media (min-width: 640px){ .modal{ border-radius: 20px; } }
  @keyframes slideUp{ from{ transform: translateY(24px); opacity:0;} to{ transform:none; opacity:1;} }

  .modal h2{ font-family:"Noto Serif TC", serif; font-size:20px; letter-spacing:0.1em; margin: 0 0 18px; text-align:center; }
  .modal p.sub{ font-size:13.5px; color: var(--ink-faint); text-align:center; margin:-12px 0 18px; line-height:1.7; }

  .type-tabs{ display:flex; background: var(--card-soft); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .type-tabs button{
    flex:1; border:none; background:none; padding: 9px 0; font-size:15px; font-weight:500;
    color: var(--ink-soft); border-radius:9px; cursor:pointer; transition: all .2s; letter-spacing:0.05em;
  }
  .type-tabs button.active{ box-shadow: 0 2px 6px rgba(74,67,57,0.1); }
  .type-tabs button[data-type="income"].active{ background: var(--sage-soft); color: var(--sage-deep); }
  .type-tabs button[data-type="expense"].active{ background: var(--clay-soft); color: var(--clay-deep); }
  .type-tabs button[data-type="transfer"].active{ background: var(--slate-soft); color: var(--slate-deep); }
  .type-tabs button[data-mode].active{ background: var(--slate-soft); color: var(--slate-deep); }

  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size:13px; letter-spacing:0.1em; color: var(--ink-soft); margin-bottom: 7px; }
  .field input[type="number"], .field input[type="date"], .field input[type="text"], .field select{
    width:100%; border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 11px 13px; font-size: 16px; font-family: "Noto Sans TC", sans-serif; color: var(--ink);
    outline:none; transition: border-color .2s;
  }
  input[type="number"]{ -moz-appearance: textfield; appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }
  .field input:focus, .field select:focus{ border-color: var(--gold); }

  .cat-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat-chip{
    border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 4px;
    font-size: 14px; text-align:center; cursor:pointer; color: var(--ink-soft); transition: all .15s;
  }
  .cat-chip.selected{ border-color: transparent; color:#fff; }
  .type-income .cat-chip.selected{ background: var(--sage-deep); }
  .type-expense .cat-chip.selected{ background: var(--clay-deep); }
  .type-transfer .cat-chip.selected{ background: var(--slate-deep); }

  .row-2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .row-3{ display:grid; grid-template-columns: 1.3fr 1fr 1.3fr; gap:10px; }

  .save-btn{
    width:100%; padding: 13px; border:none; border-radius: 12px; background: var(--ink); color: var(--bg);
    font-size:16px; letter-spacing:0.15em; font-family:"Noto Serif TC", serif; cursor:pointer;
    margin-top: 6px; transition: opacity .2s;
  }
  .save-btn:hover{ opacity:0.85; }
  .save-btn.ghost{ background: var(--card-soft); color: var(--ink-soft); margin-top:10px; }
  .cancel-x{ position:absolute; top:20px; right:20px; background:none; border:none; color: var(--ink-faint); font-size:20px; cursor:pointer; }


  .toast{
    position:fixed; bottom: 100px; left:50%; transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: 20px; font-size:14.5px;
    opacity:0; pointer-events:none; transition: all .25s ease; z-index: 200; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  /* ---------- Onboarding balances ---------- */
  .ob-group{ margin-bottom: 18px; }
  .ob-group h4{ font-size:13px; letter-spacing:0.12em; color: var(--ink-faint); margin: 0 0 8px; }
  .ob-account{ background: var(--card-soft); border-radius: 12px; padding: 12px 12px 6px; margin-bottom:10px; }
  .ob-account .ob-name{ font-size:15px; font-weight:500; margin-bottom:8px; }
  .ob-name-row{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .ob-name-input{
    font-size:15px; font-weight:500; font-family:"Noto Sans TC", sans-serif;
    border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fff;
    flex:1; min-width:0; color: var(--ink);
  }
  .ob-name-hint{ font-size:12.5px; color: var(--ink-faint); white-space:nowrap; }
  .ob-row{ display:grid; grid-template-columns: 1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center; }
  .ob-row select, .ob-row input{
    border: 1px solid var(--line); background:#fff; border-radius:8px; padding:8px 9px; font-size:14.5px;
    font-family:"Noto Sans TC",sans-serif; color: var(--ink);
  }
  .ob-row .ob-rm{ background:none; border:none; color: var(--ink-faint); cursor:pointer; font-size:15.5px; }
  .ob-add{ background:none; border:none; color: var(--gold); font-size:13.5px; cursor:pointer; padding:4px 0; }

  /* ---------- Illustrations ---------- */
  .brand-row{ display:flex; align-items:center; gap:10px; }
  .doodle{ display:block; flex-shrink:0; }
  .title-row{ display:flex; align-items:center; gap:10px; margin:-14px 0 24px; }
  .title-row h1.title{ margin:0; }

  .empty-illustration{ display:block; margin: 0 auto 14px; }
  .tab-icon{ display:inline-block; vertical-align:-4px; margin-right:5px; }
  .group-icon{ display:inline-block; vertical-align:-4px; margin-right:6px; opacity:0.75; }
  .ob-header-illustration{ display:block; margin: -4px auto 6px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand-row">
      <svg class="doodle" width="24" height="24" viewBox="0 0 32 32" fill="none">
        <path d="M16 28 C16 20 16 14 16 6" stroke="var(--sage-deep)" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16 13 C12 11 9 12 7 9" stroke="var(--sage)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path d="M16 18 C20 16 23 17 25 14" stroke="var(--sage)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <circle cx="16" cy="6" r="2.1" fill="var(--gold)"/>
      </svg>
      <span class="mark">a journal of quiet spending</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="authBtn" title="使用 Google 登入以跨裝置同步">G</button>
      <button class="icon-btn" id="settingsBtn" title="帳戶設定">⚙</button>
      <button class="icon-btn" id="exportBtn" title="匯出備份">⇩</button>
      <button class="icon-btn" id="importBtn" title="匯入備份">⇧</button>
      <input type="file" id="importFile" accept="application/json">
      <button class="icon-btn" id="undoImportBtn" title="還原批次匯入（刪除某個匯入檔案裡的所有紀錄）">↩</button>
      <input type="file" id="undoImportFile" accept="application/json">
    </div>
  </header>
  <div class="title-row">
    <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
      <path d="M9 23 C7 17 9 10 16 7 C23 10 25 17 23 23 C21 26 11 26 9 23Z" stroke="var(--clay-deep)" stroke-width="1.4" fill="var(--clay-soft)"/>
      <path d="M16 23 C16 17 16 12 16 8" stroke="var(--sage-deep)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="16" cy="6.5" r="2.3" fill="var(--gold)"/>
    </svg>
    <h1 class="title">Faye's手帳</h1>
  </div>
  <div class="cloud-status"><span id="cloudStatusText">尚未登入・僅存在本機</span> <a id="manualSyncLink" style="display:none;">立即同步本機資料到雲端</a></div>

  <div class="filter-row">
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <div class="month-label" id="monthLabel">2026 年 8 月</div>
      <button id="nextMonth">›</button>
    </div>
    <div class="acct-filter">
      <select id="acctFilterSelect"><option value="">全部帳戶</option></select>
    </div>
  </div>

  <div class="summary">
    <div class="sum-card income"><div class="label">收入</div><div class="num cny" id="sumIncome">0</div></div>
    <div class="sum-card expense"><div class="label">支出</div><div class="num cny" id="sumExpense">0</div></div>
    <div class="sum-card balance"><div class="label">結餘</div><div class="num cny" id="sumBalance">0</div></div>
  </div>

  <div class="fx-summary" id="fxSummary"></div>

  <div class="breakdown">
    <div class="bd-card income"><h3><span class="dot"></span>收入分佈</h3><div id="bdIncome"></div></div>
    <div class="bd-card expense"><h3><span class="dot"></span>支出分佈</h3><div id="bdExpense"></div></div>
  </div>

  <div class="list-title">— 本月紀錄 —</div>
  <div id="txList"></div>

  <div class="section-card">
    <div class="section-head" id="monthlyHistoryToggle">
      <span class="section-title">— 月度總覽 —</span>
      <button class="toggle-btn" id="monthlyHistoryBtn" type="button">+</button>
    </div>
    <div class="section-body" id="monthlyHistoryBody" style="display:none;">
      <div id="monthlyHistoryList"></div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-head" id="trendToggle">
      <span class="section-title">— 細項趨勢 —</span>
      <button class="toggle-btn" id="trendBtn" type="button">+</button>
    </div>
    <div class="section-body" id="trendBody" style="display:none;">
      <div class="trend-controls">
        <div class="type-tabs" id="trendTypeTabs">
          <button data-type="expense" class="active">支出</button>
          <button data-type="income">收入</button>
        </div>
        <select id="trendCatSelect"></select>
      </div>
      <div id="trendChartWrap"></div>
    </div>
  </div>

  <div class="accounts-title"><span>— 帳戶總覽 —</span><span class="edit-link" id="editBalancesLink">設定起始餘額</span></div>
  <div class="acct-groups" id="acctGroups"></div>

  <div class="version-note" id="versionNote">本檔案由 Faye 設計製作，請勿公開使用</div>

</div>

<button class="fab" id="fabAdd">+</button>

<!-- Add transaction modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="cancel-x" id="modalClose">✕</button>
    <h2>新增一筆</h2>
    <div class="type-tabs" id="mainTypeTabs">
      <button data-type="expense" class="active">
        <svg class="tab-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 8h12l-1 12H7L6 8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" stroke="currentColor" stroke-width="1.6"/></svg>
        支出
      </button>
      <button data-type="income">
        <svg class="tab-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v8M9 10.5c0-1.4 1.3-2.2 3-2.2s3 .8 3 2c0 1.6-1.8 1.8-3 2.2-1.4.4-3 .8-3 2.3 0 1.2 1.3 2 3 2s3-.8 3-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        收入
      </button>
      <button data-type="transfer">
        <svg class="tab-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 9h13M13 5l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 15H7M11 11l-4 4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        轉帳
      </button>
    </div>

    <form id="txForm" class="type-expense">
      <div class="field" id="categoryField">
        <label>分類</label>
        <div class="cat-grid" id="catGrid"></div>
        <input type="hidden" id="catValue" required>
      </div>

      <div class="field" id="singleAcctField">
        <label>帳戶</label>
        <select id="acctInput"></select>
      </div>

      <div class="field" id="transferFields" style="display:none;">
        <div class="type-tabs" id="transferModeTabs" style="margin-bottom:16px;">
          <button type="button" data-mode="twd" class="active">台幣互轉</button>
          <button type="button" data-mode="fx">外幣互轉</button>
        </div>
        <div class="row-2">
          <div>
            <label>轉出帳戶</label>
            <select id="fromAcctInput"></select>
          </div>
          <div>
            <label>轉入帳戶</label>
            <select id="toAcctInput"></select>
          </div>
        </div>
        <div class="row-2" id="fxAmountFields" style="display:none; margin-top:16px;">
          <div class="field">
            <label>轉出金額</label>
            <div style="display:flex; gap:6px;">
              <input type="text" id="fxFromAmount" inputmode="decimal" autocomplete="off" placeholder="0" style="flex:1;">
              <select id="fxFromCurrency" style="width:92px;"></select>
            </div>
          </div>
          <div class="field">
            <label>轉入金額</label>
            <div style="display:flex; gap:6px;">
              <input type="text" id="fxToAmount" inputmode="decimal" autocomplete="off" placeholder="0" style="flex:1;">
              <select id="fxToCurrency" style="width:92px;"></select>
            </div>
          </div>
        </div>
      </div>

      <div class="row-3" id="mainAmountRow">
        <div class="field" id="amountField">
          <label>金額</label>
          <input type="text" id="amountInput" inputmode="decimal" autocomplete="off" placeholder="0">
        </div>
        <div class="field" id="currencyField">
          <label>幣別</label>
          <select id="currencyInput"></select>
        </div>
        <div class="field">
          <label>日期</label>
          <input type="date" id="dateInput" required>
        </div>
      </div>

      <div class="calc-wrap">

(function(){
  const CATS = {

  const CURRENCIES = {

  ];
  const ACCOUNT_GROUPS = ["現金","電子支付","信用卡","銀行帳戶"];
  function getAccount(id){ return ACCOUNTS.find(a => a.id === id); }

  const GROUP_ICONS = {
    "現金": '<svg class="group-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="13" r="3" stroke="currentColor" stroke-width="1.4"/></svg>',
    "電子支付": '<svg class="group-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="6" y="3" width="12" height="18" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 18h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9 8.5c0-.9 1-1.6 3-1.6s3 .7 3 1.6c0 1.4-1.6 1.6-3 2-1.3.3-3 .7-3 2.1 0 1 1.1 1.7 3 1.7s3-.7 3-1.7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
    "信用卡": '<svg class="group-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5" width="19" height="14" rx="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 9.5h19" stroke="currentColor" stroke-width="1.5"/><path d="M6 15h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    "銀行帳戶": '<svg class="group-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 9.5 12 4l9 5.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4.5 9.5v9M9 9.5v9M15 9.5v9M19.5 9.5v9" stroke="currentColor" stroke-width="1.4"/><path d="M3 18.5h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
  };

  const STORAGE_KEY = "shiguang_ledger_transactions_v2";
  const OPENING_KEY = "shiguang_ledger_openings_v1";
  const ONBOARD_KEY = "shiguang_ledger_onboarded_v1";
  const ACCOUNT_NAMES_KEY = "shiguang_ledger_account_names_v1";

  let transactions = [];
  try{ transactions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }catch(e){ transactions = []; }

  let openings = {}; // { accountId: { CUR: amount } }
  try{ openings = JSON.parse(localStorage.getItem(OPENING_KEY) || "{}"); }catch(e){ openings = {}; }

  let accountNames = {}; // { accountId: "自訂名稱" }
  try{ accountNames = JSON.parse(localStorage.getItem(ACCOUNT_NAMES_KEY) || "{}"); }catch(e){ accountNames = {}; }
  function applyAccountNames(){
    ACCOUNTS.forEach(a => { if(accountNames[a.id]) a.name = accountNames[a.id]; });
  }
  applyAccountNames();

  function saveTxLocal(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions)); }
  function saveOpeningsLocal(){ localStorage.setItem(OPENING_KEY, JSON.stringify(openings)); }
  function saveAccountNamesLocal(){ localStorage.setItem(ACCOUNT_NAMES_KEY, JSON.stringify(accountNames)); }

  // ---------- Cloud sync (Firebase) ----------
  const ALLOWED_EMAIL = "ck15033@gmail.com";
  let currentUser = null;
  let unsubTx = null;
  let unsubOpenings = null;
  let unsubAccountNames = null;

  function upsertLocal(tx){
    const idx = transactions.findIndex(t => t.id === tx.id);
    if(idx >= 0) transactions[idx] = tx; else transactions.push(tx);
  }
  function removeLocal(id){ transactions = transactions.filter(t => t.id !== id); }

  async function persistTxUpsert(tx){
    upsertLocal(tx);
    saveTxLocal();
    render();
    if(currentUser){
      try{ await setDoc(doc(db, "users", currentUser.uid, "transactions", tx.id), tx); }
      catch(e){ showToast("雲端同步失敗，稍後會自動重試"); }
    }
  }
  async function persistTxDelete(id){
    removeLocal(id);
    saveTxLocal();
    render();
    if(currentUser){
      try{ await deleteDoc(doc(db, "users", currentUser.uid, "transactions", id)); }
      catch(e){ showToast("雲端刪除失敗，稍後會自動重試"); }
    }
  }
  async function persistOpenings(newOpenings){
    openings = newOpenings;
    saveOpeningsLocal();
    render();
    if(currentUser){
      try{ await setDoc(doc(db, "users", currentUser.uid, "settings", "openings"), openings); }
      catch(e){ showToast("雲端同步失敗，稍後會自動重試"); }
    }
  }
  async function persistAccountNames(newNames){
    accountNames = newNames;
    saveAccountNamesLocal();
    applyAccountNames();
    refreshAccountLabelsUI();
    render();
    if(currentUser){
      try{ await setDoc(doc(db, "users", currentUser.uid, "settings", "accountNames"), accountNames); }
      catch(e){ showToast("雲端同步失敗，稍後會自動重試"); }
    }
  }
  async function cloudBatchUpsert(txArray){
    const chunkSize = 400;
    for(let i=0; i<txArray.length; i+=chunkSize){
      const chunk = txArray.slice(i, i+chunkSize);
      const batch = writeBatch(db);
      chunk.forEach(t => batch.set(doc(db, "users", currentUser.uid, "transactions", t.id), t));
      await batch.commit();
    }
  }
  async function cloudBatchDelete(ids){
    const chunkSize = 400;
    for(let i=0; i<ids.length; i+=chunkSize){
      const chunk = ids.slice(i, i+chunkSize);
      const batch = writeBatch(db);
      chunk.forEach(id => batch.delete(doc(db, "users", currentUser.uid, "transactions", id)));
      await batch.commit();
    }
  }

  function subscribeCloud(uid){
    if(unsubTx) unsubTx();
    if(unsubOpenings) unsubOpenings();
    if(unsubAccountNames) unsubAccountNames();
    const txCol = collection(db, "users", uid, "transactions");
    unsubTx = onSnapshot(txCol, snap => {
      transactions = snap.docs.map(d => d.data());
      saveTxLocal();
      render();
    }, () => showToast("雲端連線發生問題"));

    const opDoc = doc(db, "users", uid, "settings", "openings");
    unsubOpenings = onSnapshot(opDoc, snap => {
      openings = snap.exists() ? snap.data() : {};
      saveOpeningsLocal();
      render();
    }, () => {});

    const namesDoc = doc(db, "users", uid, "settings", "accountNames");
    unsubAccountNames = onSnapshot(namesDoc, snap => {
      accountNames = snap.exists() ? snap.data() : {};
      saveAccountNamesLocal();
      applyAccountNames();
      refreshAccountLabelsUI();
      render();
    }, () => {});
  }
  function unsubscribeCloud(){
    if(unsubTx){ unsubTx(); unsubTx = null; }
    if(unsubOpenings){ unsubOpenings(); unsubOpenings = null; }
    if(unsubAccountNames){ unsubAccountNames(); unsubAccountNames = null; }
  }

  function updateCloudStatusUI(){
    const el = document.getElementById("cloudStatusText");
    const wrap = el.parentElement;
    const btn = document.getElementById("authBtn");
    const syncLink = document.getElementById("manualSyncLink");
    if(currentUser){
      el.textContent = `已同步・${currentUser.email || currentUser.displayName || "已登入"}`;
      wrap.classList.add("on");
      btn.title = (currentUser.email || "已登入") + "（點擊登出）";
      if(currentUser.photoURL){
        btn.innerHTML = `<img src="${currentUser.photoURL}" referrerpolicy="no-referrer">`;
      } else {
        btn.textContent = (currentUser.displayName || "U").charAt(0);
      }
      btn.classList.add("logged-in");
      syncLink.style.display = "inline";
    } else {
      el.textContent = "尚未登入・僅存在本機";
      wrap.classList.remove("on");
      btn.title = "使用 Google 登入以跨裝置同步";
      btn.textContent = "G";
      btn.classList.remove("logged-in");
      syncLink.style.display = "none";
    }
  }

  document.getElementById("manualSyncLink").addEventListener("click", async () => {
    if(!currentUser){ showToast("請先登入"); return; }
    if(transactions.length === 0){ showToast("這台裝置目前沒有本機資料可以同步"); return; }
    showToast("正在核對雲端資料…");
    try{
      const txCol = collection(db, "users", currentUser.uid, "transactions");
      const snap = await getDocs(txCol);
      const cloudIds = new Set(snap.docs.map(d => d.id));
      const missing = transactions.filter(t => !cloudIds.has(t.id));
      if(missing.length === 0){
        showToast("資料已經是最新的，不需要同步");
        return;
      }
      const ok = confirm(`偵測到這台裝置有 ${missing.length} 筆紀錄雲端還沒有，要上傳嗎？`);
      if(!ok) return;
      showToast("正在同步到雲端…");
      await cloudBatchUpsert(missing);
      if(Object.keys(openings).length > 0){
        await setDoc(doc(db, "users", currentUser.uid, "settings", "openings"), openings);
      }
      showToast(`已同步 ${missing.length} 筆`);
    }catch(e){
      showToast("同步失敗，請稍後再試");
    }
  });

  document.getElementById("authBtn").addEventListener("click", () => {
    if(currentUser){
      if(confirm("要登出嗎？登出後將只使用本機資料。")) signOut(auth);
    } else {
      signInWithPopup(auth, googleProvider).catch(err => showToast("登入失敗：" + err.message));
    }
  });

  onAuthStateChanged(auth, async (user) => {
    if(user && user.email !== ALLOWED_EMAIL){
      alert("這個帳本僅限特定 Google 帳號使用，這個帳號沒有存取權限，即將登出。");
      await signOut(auth);
      return;
    }
    currentUser = user;
    updateCloudStatusUI();
    if(user){
      try{
        const txCol = collection(db, "users", user.uid, "transactions");
        const snap = await getDocs(txCol);
        if(snap.empty && transactions.length > 0){
          const ok = confirm(`偵測到這台裝置本機有 ${transactions.length} 筆尚未同步的紀錄，要上傳到雲端嗎？`);
          if(ok){
            await cloudBatchUpsert(transactions);
            if(Object.keys(openings).length > 0){
              await setDoc(doc(db, "users", user.uid, "settings", "openings"), openings);
            }
          }
        }
      }catch(e){ showToast("雲端連線發生問題"); }
      subscribeCloud(user.uid);
    } else {
      unsubscribeCloud();
      try{ transactions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }catch(e){ transactions = []; }
      try{ openings = JSON.parse(localStorage.getItem(OPENING_KEY) || "{}"); }catch(e){ openings = {}; }
      render();
    }
  });

  let current = new Date();
  current.setDate(1);
  let acctFilter = "";

  const monthLabel = document.getElementById("monthLabel");
  const sumIncome = document.getElementById("sumIncome");
  const sumExpense = document.getElementById("sumExpense");
  const sumBalance = document.getElementById("sumBalance");
  const bdIncome = document.getElementById("bdIncome");
  const bdExpense = document.getElementById("bdExpense");
  const txList = document.getElementById("txList");
  const acctGroups = document.getElementById("acctGroups");
  const acctFilterSelect = document.getElementById("acctFilterSelect");

  const DECIMAL_CURRENCIES = { HKD: 2 };
  function fmt(n, cur){
    const decimals = DECIMAL_CURRENCIES[cur] || 0;
    return Number(n).toLocaleString("zh-Hant", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
  function localDateStr(d){
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function sanitizeNumericInput(el){
    el.addEventListener("input", () => {
      el.value = el.value.replace(/[^0-9.+\-*/() ]/g, "");
    });
  }
  function evaluateExpr(str){
    if(str == null) return NaN;
    const cleaned = String(str).trim();
    if(cleaned === "") return NaN;
    if(!/^[0-9+\-*/(). ]+$/.test(cleaned)) return NaN;
    try{
      const result = Function('"use strict"; return (' + cleaned + ')')();
      if(typeof result !== "number" || !isFinite(result)) return NaN;
      return Math.round(result * 100) / 100;
    }catch(e){ return NaN; }
  }

  // ---------- Account filter dropdown ----------
  function buildAcctFilterSelect(){
    const prev = acctFilterSelect.value;
    acctFilterSelect.innerHTML = "";
    ACCOUNT_GROUPS.forEach(group => {
      const og = document.createElement("optgroup");
      og.label = group;
      ACCOUNTS.filter(a => a.group === group).forEach(a => {
        const opt = document.createElement("option");
        opt.value = a.id; opt.textContent = a.name;
        og.appendChild(opt);
      });
      acctFilterSelect.appendChild(og);
    });
    if(prev) acctFilterSelect.value = prev;
  }
  buildAcctFilterSelect();
  acctFilterSelect.addEventListener("change", () => { acctFilter = acctFilterSelect.value; render(); });

  // ---------- Balance computation (all-time, independent of month filter) ----------
  function computeBalances(){
    // balances[accountId][currency] = amount
    const balances = {};
    ACCOUNTS.forEach(a => { balances[a.id] = Object.assign({}, openings[a.id] || {}); });

    transactions.forEach(t => {
      const cur = txCurrency(t);
      if(t.type === "income" || t.type === "expense"){
        const acct = getAccount(t.account);
        if(!acct) return;
        if(!(cur in balances[acct.id])) balances[acct.id][cur] = 0;
        const sign = (t.type === "income") ? 1 : -1;
        const flip = (acct.kind === "liability") ? -1 : 1;
        balances[acct.id][cur] += sign * flip * t.amount;
      } else if(t.type === "transfer"){
        const fromA = getAccount(t.fromAccount);
        const toA = getAccount(t.toAccount);
        const toCur = t.toCurrency || cur;
        const toAmt = (typeof t.toAmount === "number") ? t.toAmount : t.amount;
        if(fromA){
          if(!(cur in balances[fromA.id])) balances[fromA.id][cur] = 0;
          const flip = (fromA.kind === "liability") ? -1 : 1;
          balances[fromA.id][cur] += -1 * flip * t.amount;
        }
        if(toA){
          if(!(toCur in balances[toA.id])) balances[toA.id][toCur] = 0;
          const flip = (toA.kind === "liability") ? -1 : 1;
          balances[toA.id][toCur] += 1 * flip * toAmt;
        }
      }
    });
    return balances;
  }

  function renderAccounts(){
    const balances = computeBalances();
    acctGroups.innerHTML = "";
    ACCOUNT_GROUPS.forEach(group => {
      const accts = ACCOUNTS.filter(a => a.group === group);
      const card = document.createElement("div");
      card.className = "acct-group-card";
      let html = `<h4>${GROUP_ICONS[group]||''}${group}</h4>`;
      accts.forEach(a => {
        const bal = balances[a.id] || {};
        const currencies = Object.keys(bal).filter(c => Math.abs(bal[c]) > 0.005);
        if(currencies.length === 0){
          html += `<div class="acct-line"><span class="a-name">${a.name}</span><span class="a-amt ${a.kind}">${a.kind==='liability' ? '－' : (currencySymbol(DEFAULT_CURRENCY)+' 0')}</span></div>`;
        } else if(currencies.length === 1){
          const c = currencies[0];
          html += `<div class="acct-line"><span class="a-name">${a.name}</span>${acctAmtHtml(a.kind, bal[c], c)}</div>`;
        } else {
          const lines = currencies.map(c => acctAmtInline(a.kind, bal[c], c)).join("　");
          html += `<div class="acct-line"><span class="a-name">${a.name}</span><span class="a-sub">${lines}</span></div>`;
        }
      });
      card.innerHTML = html;
      acctGroups.appendChild(card);
    });
  }
  function acctAmtHtml(kind, amt, cur){
    if(kind === "liability"){
      return `<span class="a-amt liability">未繳 ${currencySymbol(cur)}${fmt(Math.abs(amt), cur)}</span>`;
    }
    if(amt < -0.005){
      return `<span class="a-amt warning">⚠ 餘額不足 -${currencySymbol(cur)}${fmt(Math.abs(amt), cur)}</span>`;
    }
    return `<span class="a-amt asset">${currencySymbol(cur)}${fmt(amt, cur)}</span>`;
  }
  function acctAmtInline(kind, amt, cur){
    if(kind === "liability") return `${cur} ${currencySymbol(cur)}${fmt(Math.abs(amt), cur)}`;
    if(amt < -0.005) return `<span class="warning-inline">⚠ ${cur} -${currencySymbol(cur)}${fmt(Math.abs(amt), cur)}</span>`;
    return `${cur} ${currencySymbol(cur)}${fmt(amt, cur)}`;
  }

  // ---------- Monthly history (collapsible) ----------
  function renderMonthlyHistory(){
    const el = document.getElementById("monthlyHistoryList");
    const byMonth = {};
    transactions.forEach(t => {
      if(txCurrency(t) !== DEFAULT_CURRENCY) return;
      const key = t.date.slice(0,7);
      if(!byMonth[key]) byMonth[key] = { income: 0, expense: 0 };
      if(t.type === "income") byMonth[key].income += t.amount;
      else if(t.type === "expense") byMonth[key].expense += t.amount;
    });
    const keys = Object.keys(byMonth).sort().reverse();
    if(keys.length === 0){
      el.innerHTML = '<div class="mh-empty">還沒有任何紀錄</div>';
      return;
    }
    const header = `<div class="mh-row mh-header">
      <span class="mh-month">月份</span>
      <span class="mh-nums"><span class="mh-in">收入</span><span class="mh-out">支出</span><span class="mh-bal">結餘</span></span>
    </div>`;
    el.innerHTML = header + keys.map(key => {
      const [y, m] = key.split("-");
      const d = byMonth[key];
      const bal = d.income - d.expense;
      const balClass = bal >= 0 ? "mh-in" : "mh-out";
      const balSign = bal >= 0 ? "+" : "−";
      return `<div class="mh-row">
        <span class="mh-month">${y} 年 ${parseInt(m,10)} 月</span>
        <span class="mh-nums"><span class="mh-in">+${fmt(d.income)}</span><span class="mh-out">−${fmt(d.expense)}</span><span class="${balClass}">${balSign}${fmt(Math.abs(bal))}</span></span>
      </div>`;
    }).join("");
  }

  function renderTrendChart(){
    const wrap = document.getElementById("trendChartWrap");
    if(!wrap) return;
    const cat = trendCatSelect.value;
    const byMonth = {};
    transactions.forEach(t => {
      if(t.type !== trendType) return;
      if(t.category !== cat) return;
      if(txCurrency(t) !== DEFAULT_CURRENCY) return;
      const key = t.date.slice(0,7);
      byMonth[key] = (byMonth[key] || 0) + t.amount;
    });
    const keys = Object.keys(byMonth).sort();
    if(keys.length === 0){
      wrap.innerHTML = `<div class="trend-empty">「${cat}」目前還沒有台幣紀錄可以畫趨勢圖</div>`;
      return;
    }
    const values = keys.map(k => byMonth[k]);
    const total = values.reduce((a,b) => a+b, 0);
    const max = Math.max(...values, 1);
    const W = 640, H = 220, padL = 44, padR = 20, padT = 20, padB = 32;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const stepX = keys.length > 1 ? plotW / (keys.length - 1) : 0;
    const color = trendType === "income" ? "var(--sage)" : "var(--clay)";
    const colorDeep = trendType === "income" ? "var(--sage-deep)" : "var(--clay-deep)";
    const fillColor = trendType === "income" ? "var(--sage-soft)" : "var(--clay-soft)";

    const points = values.map((v, i) => {
      const x = padL + (keys.length === 1 ? plotW/2 : stepX * i);
      const y = padT + plotH - (v / max) * plotH;
      return { x, y, v, key: keys[i] };
    });
    const linePath = points.map((p,i) => (i===0?"M":"L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    const areaPath = linePath + ` L ${points[points.length-1].x.toFixed(1)},${(padT+plotH).toFixed(1)} L ${points[0].x.toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

    const labelEvery = keys.length > 8 ? Math.ceil(keys.length / 8) : 1;
    const xLabels = points.map((p,i) => {
      if(i % labelEvery !== 0 && i !== points.length-1) return "";
      const [y,m] = p.key.split("-");
      return `<text x="${p.x.toFixed(1)}" y="${H-10}" font-size="10.5" text-anchor="middle" fill="var(--ink-faint)">${parseInt(m,10)}月</text>`;
    }).join("");

    const dots = points.map(p =>
      `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" fill="${colorDeep}"><title>${p.key}：${fmt(p.v)}</title></circle>`
    ).join("");

    wrap.innerHTML = `
      <div class="trend-chart-card">
        <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;">
          <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--line)" stroke-width="1"/>
          <path d="${areaPath}" fill="${fillColor}" opacity="0.7"/>
          <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2"/>
          ${dots}
          ${xLabels}
        </svg>
        <div class="trend-total">${cat}累計 ${trendType==='income'?'收入':'支出'} NT$ ${fmt(total)}（近 ${keys.length} 個月）</div>
      </div>
    `;
  }

  function render(){
    monthLabel.textContent = current.getFullYear() + " 年 " + (current.getMonth()+1) + " 月";
    const key = monthKey(current);
    let monthTx = transactions.filter(t => t.date.slice(0,7) === key);
    if(acctFilter){
      monthTx = monthTx.filter(t => t.account === acctFilter || t.fromAccount === acctFilter || t.toAccount === acctFilter);
    }
    monthTx = monthTx.sort((a,b) => b.date.localeCompare(a.date) || (b.createdAt||0) - (a.createdAt||0));

    let income = 0, expense = 0;
    const incomeByCat = {}, expenseByCat = {};
    const fxIncome = {}, fxExpense = {};
    monthTx.forEach(t => {
      const cur = txCurrency(t);
      if(t.type === "income"){
        if(cur === DEFAULT_CURRENCY){ income += t.amount; incomeByCat[t.category] = (incomeByCat[t.category]||0) + t.amount; }
        else { fxIncome[cur] = (fxIncome[cur]||0) + t.amount; }
      } else if(t.type === "expense"){
        if(cur === DEFAULT_CURRENCY){ expense += t.amount; expenseByCat[t.category] = (expenseByCat[t.category]||0) + t.amount; }
        else { fxExpense[cur] = (fxExpense[cur]||0) + t.amount; }
      }
    });

    sumIncome.textContent = fmt(income);
    sumExpense.textContent = fmt(expense);
    sumBalance.textContent = fmt(income - expense);

    renderBreakdown(bdIncome, incomeByCat, income, "income");
    renderBreakdown(bdExpense, expenseByCat, expense, "expense");
    renderFxSummary(fxIncome, fxExpense);
    renderList(monthTx);
    renderAccounts();
    renderMonthlyHistory();
    renderTrendChart();
  }

  function renderBreakdown(container, byCat, total, type){
    container.innerHTML = "";
    const entries = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
    if(entries.length === 0){ container.innerHTML = '<div class="bd-empty">本月尚無紀錄</div>'; return; }
    entries.forEach(([cat, amt]) => {
      const pct = total > 0 ? Math.round(amt/total*100) : 0;
      const row = document.createElement("div");
      row.className = "bd-row " + type;
      row.innerHTML = `<div class="r-top"><span>${cat}</span><b>${fmt(amt)} · ${pct}%</b></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`;
      container.appendChild(row);
    });
  }

  function renderFxSummary(fxIncome, fxExpense){
    const el = document.getElementById("fxSummary");
    const currencies = new Set([...Object.keys(fxIncome), ...Object.keys(fxExpense)]);
    if(currencies.size === 0){ el.innerHTML = ""; return; }
    let html = "";
    currencies.forEach(cur => {
      const inc = fxIncome[cur] || 0, exp = fxExpense[cur] || 0, sym = currencySymbol(cur);
      if(inc > 0) html += `<span class="fx-chip">${cur} 收入 <b>${sym}${fmt(inc, cur)}</b></span>`;
      if(exp > 0) html += `<span class="fx-chip">${cur} 支出 <b>${sym}${fmt(exp, cur)}</b></span>`;
    });
    el.innerHTML = html;
  }

  function renderList(monthTx){
    txList.innerHTML = "";
    if(monthTx.length === 0){
      txList.innerHTML = `<div class="empty-state">
        <svg class="empty-illustration" width="86" height="86" viewBox="0 0 100 100" fill="none">
          <ellipse cx="50" cy="82" rx="30" ry="4" fill="var(--line)" opacity="0.5"/>
          <path d="M32 78 L30 40 Q30 32 40 30 L60 30 Q70 32 70 40 L68 78 Z" stroke="var(--ink-faint)" stroke-width="1.6" fill="var(--card-soft)"/>
          <path d="M40 30 L40 24 Q40 18 50 18 Q60 18 60 24 L60 30" stroke="var(--ink-faint)" stroke-width="1.6" fill="none"/>
          <circle cx="50" cy="52" r="9" fill="var(--gold)" opacity="0.85"/>
          <path d="M46 52 h8 M50 48 v8" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M22 66 C18 58 21 48 30 45" stroke="var(--sage)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          <circle cx="21" cy="46" r="2.4" fill="var(--sage-deep)"/>
        </svg>
        <span class="mark">still &amp; quiet</span>這個月還沒有紀錄，點右下角開始記帳吧
      </div>`;
      return;
    }
    const groups = {};
    monthTx.forEach(t => { groups[t.date] = groups[t.date] || []; groups[t.date].push(t); });
    Object.keys(groups).sort().reverse().forEach(date => {
      const d = new Date(date + "T00:00:00");
      const dayStr = (d.getMonth()+1) + "/" + d.getDate() + "（" + "日一二三四五六"[d.getDay()] + "）";
      const dayHead = document.createElement("div");
      dayHead.className = "day-head";
      dayHead.innerHTML = `<span>${dayStr}</span><div class="line"></div>`;
      const groupWrap = document.createElement("div");
      groupWrap.className = "day-group";
      groupWrap.appendChild(dayHead);

      groups[date].forEach(t => {
        const card = document.createElement("div");
        card.className = "tx-card " + t.type;
        const sign = t.type === "income" ? "+" : (t.type === "expense" ? "−" : "");
        const tagText = t.type === "income" ? "收入" : (t.type === "expense" ? "支出" : "轉帳");
        const cur = txCurrency(t);
        const sym = currencySymbol(cur);
        const curTag = cur !== DEFAULT_CURRENCY ? `<span class="tx-tag" style="background:var(--slate-soft);color:var(--slate-deep);">${cur}</span>` : "";

        let noteText = t.note || "";
        let acctText = "";
        let showCheck = false;
        if(t.type === "transfer"){
          const fromA = getAccount(t.fromAccount), toA = getAccount(t.toAccount);
          acctText = [fromA?fromA.name:"", toA?toA.name:""].filter(Boolean).join(" → ");
          showCheck = (fromA && fromA.kind==="liability") || (toA && toA.kind==="liability");
        } else {
          const a = getAccount(t.account);
          acctText = a ? a.name : "";
          showCheck = a && a.kind === "liability";
        }

        const checkHtml = showCheck
          ? `<div class="tx-check ${t.reconciled?'checked':''}" data-id="${t.id}" title="信用卡勾稽">${t.reconciled?'✓':''}</div>`
          : `<div style="width:16px;"></div>`;

        const isFxTransfer = t.type === "transfer" && typeof t.toAmount === "number" && (t.toCurrency || cur) !== cur;
        const amtHtml = isFxTransfer
          ? `<div class="tx-amt" style="font-size:15px;">－${sym}${fmt(t.amount, cur)}<br>＋${currencySymbol(t.toCurrency)}${fmt(t.toAmount, t.toCurrency)}</div>`
          : `<div class="tx-amt">${sign} ${sym}${fmt(t.amount, cur)}</div>`;

        card.innerHTML = `
          <div class="tx-left">
            ${checkHtml}
            <div class="tx-text">
              <div class="tx-cat"><span class="tx-tag">${tagText}</span>${curTag}${t.category}</div>
              ${acctText ? `<div class="tx-acct">${acctText}</div>` : ""}
              ${noteText ? `<div class="tx-note">${noteText}</div>` : ""}
            </div>
          </div>
          <div class="tx-right">
            ${amtHtml}
            <button class="tx-del" data-id="${t.id}">✕</button>
          </div>
        `;
        groupWrap.appendChild(card);
      });
      txList.appendChild(groupWrap);
    });

    txList.querySelectorAll(".tx-del").forEach(btn => {
      btn.addEventListener("click", () => {
        if(!confirm("確定要刪除這筆紀錄嗎？此動作無法復原。")) return;
        persistTxDelete(btn.dataset.id);
        showToast("已刪除");
      });
    });
    txList.querySelectorAll(".tx-check").forEach(chk => {
      chk.addEventListener("click", () => {
        const t = transactions.find(t => t.id === chk.dataset.id);
        if(!t) return;
        persistTxUpsert(Object.assign({}, t, { reconciled: !t.reconciled }));
      });
    });
  }

  const ACCOUNT_DEFAULT_CURRENCY = { bank_hsbc_hk: "HKD" };

    const def = ACCOUNT_DEFAULT_CURRENCY[acctInput.value];
    currencyInput.value = def || DEFAULT_CURRENCY;
  });

  // ---------- Calculator (shared across amountInput / fxFromAmount / fxToAmount) ----------
  let activeAmountInput = amountInput;
  const calcPreview = document.getElementById("calcPreview");
  function updateCalcPreview(){
    const val = activeAmountInput ? activeAmountInput.value : "";
    if(/[+\-*/]/.test(val)){
      const result = evaluateExpr(val);
      let cur = DEFAULT_CURRENCY;
      if(activeAmountInput === fxFromAmount) cur = fxFromCurrency.value;
      else if(activeAmountInput === fxToAmount) cur = fxToCurrency.value;
      else if(activeAmountInput === amountInput) cur = currencyInput.value;
      calcPreview.innerHTML = isNaN(result) ? "&nbsp;" : `= ${fmt(result, cur)}`;
    } else {
      calcPreview.innerHTML = "&nbsp;";
    }
  }
  function normalizeAmountField(inp){
    const raw = inp.value.trim();
    if(raw === "") return;
    const result = evaluateExpr(raw);
    if(isNaN(result)){
      showToast("請輸入正確的金額或算式");
      return;
    }
    inp.value = String(result);
    updateCalcPreview();
  }
  [amountInput, fxFromAmount, fxToAmount].forEach(inp => {
    inp.addEventListener("focus", () => { activeAmountInput = inp; updateCalcPreview(); });
    inp.addEventListener("input", updateCalcPreview);
    inp.addEventListener("blur", () => normalizeAmountField(inp));
  });
  document.querySelectorAll(".calc-key[data-key]").forEach(btn => {
    btn.addEventListener("click", () => {
      if(!activeAmountInput) activeAmountInput = amountInput;
      activeAmountInput.value += btn.dataset.key;
      activeAmountInput.focus();
      updateCalcPreview();
    });

  [currencyInput, fxFromCurrency, fxToCurrency].forEach(sel => {

  form.addEventListener("submit", (e) => {

    const isFxTransfer = activeType === "transfer" && transferMode === "fx";
    let amt, cur, toAmt, toCur;
    if(isFxTransfer){
      amt = evaluateExpr(fxFromAmount.value);
      toAmt = evaluateExpr(fxToAmount.value);
      cur = fxFromCurrency.value;
      toCur = fxToCurrency.value;
      if(!amt || amt <= 0 || !toAmt || toAmt <= 0){ showToast("請輸入正確的金額或算式"); return; }
    } else {
      amt = evaluateExpr(amountInput.value);
      cur = (activeType === "transfer") ? DEFAULT_CURRENCY : (currencyInput.value || DEFAULT_CURRENCY);
      if(!amt || amt <= 0){ showToast("請輸入正確的金額或算式"); return; }
    }

    const tx = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random())),
      type: activeType,
      category: catValue.value,
      amount: amt,
      currency: cur,
      date: dateInput.value,
      note: noteInput.value.trim(),
      createdAt: Date.now(),
      reconciled: false
    };
    if(isFxTransfer){
      tx.toAmount = toAmt;
      tx.toCurrency = toCur;
    }
    if(activeType === "transfer"){
      tx.fromAccount = fromAcctInput.value;
      tx.toAccount = toAcctInput.value;
    } else {
      tx.account = acctInput.value;
    }
    current = new Date(tx.date + "T00:00:00"); current.setDate(1);
    persistTxUpsert(tx);
    closeModal();
    showToast("已記下這一筆");

  document.getElementById("exportBtn").addEventListener("click", () => {
    const payload = { transactions, openings };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = localDateStr();
    a.href = url; a.download = `Fayes手帳_備份_${stamp}.json`; a.click();
    URL.revokeObjectURL(url);
    showToast("已匯出備份");
  });

  const importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", () => {
    const file = importFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const data = JSON.parse(reader.result);
        const incoming = Array.isArray(data) ? data : (data.transactions || []);
        if(!Array.isArray(incoming)) throw new Error("format");
        const existingIds = new Set(transactions.map(t=>t.id));
        const newOnes = incoming.filter(t => t && t.id && !existingIds.has(t.id));
        newOnes.forEach(t => upsertLocal(t));
        saveTxLocal();
        let importedOpenings = null;
        if(!Array.isArray(data) && data.openings){
          openings = Object.assign({}, openings, data.openings);
          saveOpeningsLocal();
          importedOpenings = openings;
        }
        render();
        showToast(`已匯入 ${newOnes.length} 筆紀錄`);
        if(currentUser && newOnes.length > 0){
          showToast(`正在同步到雲端…`);
          await cloudBatchUpsert(newOnes);
          if(importedOpenings) await setDoc(doc(db, "users", currentUser.uid, "settings", "openings"), importedOpenings);
          showToast(`雲端同步完成`);
        }
      }catch(e){ showToast("檔案格式不正確"); }
      importFile.value = "";
    };
    reader.readAsText(file);
  });

  const undoImportFile = document.getElementById("undoImportFile");
  document.getElementById("undoImportBtn").addEventListener("click", () => undoImportFile.click());
  undoImportFile.addEventListener("change", () => {
    const file = undoImportFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const data = JSON.parse(reader.result);
        const list = Array.isArray(data) ? data : (data.transactions || []);
        if(!Array.isArray(list)) throw new Error("format");
        const idsInFile = new Set(list.map(t => t && t.id).filter(Boolean));
        const idsToDelete = transactions.filter(t => idsInFile.has(t.id)).map(t => t.id);
        if(idsToDelete.length === 0){
          showToast("這台裝置目前沒有符合這個檔案的紀錄可以刪除");
          return;
        }
        const ok = confirm(`這個檔案裡有 ${idsInFile.size} 筆紀錄，目前記帳本裡符合的有 ${idsToDelete.length} 筆。確定要把這 ${idsToDelete.length} 筆從本機與雲端刪除嗎？此動作無法復原。`);
        if(!ok) return;
        const idSet = new Set(idsToDelete);
        transactions = transactions.filter(t => !idSet.has(t.id));
        saveTxLocal();
        render();
        showToast(`已刪除 ${idsToDelete.length} 筆`);
        if(currentUser){
          showToast("正在同步刪除到雲端…");
          await cloudBatchDelete(idsToDelete);
          showToast("雲端同步完成");
        }
      }catch(e){ showToast("檔案格式不正確"); }
      undoImportFile.value = "";
    };
    reader.readAsText(file);
  });

  // ---------- Onboarding / balance settings ----------
  const obOverlay = document.getElementById("obOverlay");
  const obGroups = document.getElementById("obGroups");
  const obClose = document.getElementById("obClose");
  const obSave = document.getElementById("obSave");
  const obSkip = document.getElementById("obSkip");

  function openOnboarding(){
    obGroups.innerHTML = "";
    ACCOUNT_GROUPS.forEach(group => {
      const wrap = document.createElement("div");
      wrap.className = "ob-group";
      wrap.innerHTML = `<h4>${group}</h4>`;
      ACCOUNTS.filter(a => a.group === group).forEach(a => {
        const box = document.createElement("div");
        box.className = "ob-account";
        box.dataset.acct = a.id;
        const nameRow = document.createElement("div");
        nameRow.className = "ob-name-row";
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.className = "ob-name-input";
        nameInput.value = a.name;
        nameInput.placeholder = "帳戶名稱";
        nameRow.appendChild(nameInput);
        if(a.kind === "liability"){
          const hint = document.createElement("span");
          hint.className = "ob-name-hint";
          hint.textContent = "（未繳金額）";
          nameRow.appendChild(hint);
        }
        const rowsEl = document.createElement("div");
        rowsEl.className = "ob-rows";
        const addBtn = document.createElement("button");
        addBtn.type = "button"; addBtn.className = "ob-add"; addBtn.textContent = "＋ 新增幣別";
        box.appendChild(nameRow);
        box.appendChild(rowsEl);
        box.appendChild(addBtn);
        const existing = openings[a.id] || {};
        const entries = Object.entries(existing);
        if(entries.length === 0) entries.push([DEFAULT_CURRENCY, 0]);
        entries.forEach(([cur, amt]) => addObRow(rowsEl, cur, amt));
        addBtn.addEventListener("click", () => addObRow(rowsEl, DEFAULT_CURRENCY, 0));
        wrap.appendChild(box);
      });
      obGroups.appendChild(wrap);
    });
    obOverlay.classList.add("open");
  }
  function addObRow(rowsEl, cur, amt){
    const row = document.createElement("div");
    row.className = "ob-row";
    const sel = document.createElement("select");
    Object.keys(CURRENCIES).forEach(code => {
      const opt = document.createElement("option");
      opt.value = code; opt.textContent = code;
      if(code === cur) opt.selected = true;
      sel.appendChild(opt);
    });
    const input = document.createElement("input");
    input.type = "number"; input.step = "0.01"; input.inputMode = "decimal"; input.value = amt;
    sanitizeNumericInput(input);
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "ob-rm"; rm.textContent = "✕";
    rm.addEventListener("click", () => row.remove());
    row.appendChild(sel); row.appendChild(input); row.appendChild(rm);
    rowsEl.appendChild(row);
  }
  function closeOnboarding(){ obOverlay.classList.remove("open"); localStorage.setItem(ONBOARD_KEY, "1"); }

  obClose.addEventListener("click", closeOnboarding);
  obSkip.addEventListener("click", closeOnboarding);
  obOverlay.addEventListener("click", (e) => { if(e.target === obOverlay) closeOnboarding(); });

  obSave.addEventListener("click", () => {
    if(Object.keys(openings).length > 0){
      if(!confirm("你已經設定過起始餘額，再次儲存將會覆蓋原本的數值，確定要覆蓋嗎？")) return;
    }
    const newOpenings = {};
    const newNames = {};
    obGroups.querySelectorAll(".ob-account").forEach(box => {
      const acctId = box.dataset.acct;
      const map = {};
      box.querySelectorAll(".ob-row").forEach(row => {
        const cur = row.querySelector("select").value;
        const val = parseFloat(row.querySelector("input").value) || 0;
        if(val !== 0) map[cur] = (map[cur]||0) + val;
      });
      if(Object.keys(map).length > 0) newOpenings[acctId] = map;
      const nameVal = box.querySelector(".ob-name-input").value.trim();
      const defaultAcct = ACCOUNTS.find(a => a.id === acctId);
      if(nameVal && defaultAcct) newNames[acctId] = nameVal;
    });
    persistOpenings(newOpenings);
    persistAccountNames(newNames);
    closeOnboarding();
    showToast("已更新起始餘額");
  });

  document.getElementById("settingsBtn").addEventListener("click", openOnboarding);
  document.getElementById("editBalancesLink").addEventListener("click", openOnboarding);

  if(!localStorage.getItem(ONBOARD_KEY)){
    openOnboarding();
  }

  // ---------- Version note: ask GitHub when this file was last committed ----------
  async function loadVersionDate(){
    const el = document.getElementById("versionNote");
    const VERSION_CACHE_KEY = "shiguang_ledger_version_date_v1";
    try{
      const host = location.hostname; // e.g. "alice.github.io"
      if(!host.endsWith(".github.io")) throw new Error("not on github pages");
      const username = host.split(".")[0];
      const pathParts = location.pathname.split("/").filter(Boolean);
      const repo = pathParts[0];
      if(!username || !repo) throw new Error("no repo info in URL");
      const filePath = pathParts.length > 1 ? pathParts.slice(1).join("/") : "index.html";
      const apiUrl = `https://api.github.com/repos/${username}/${repo}/commits?path=${encodeURIComponent(filePath)}&per_page=1`;
      const res = await fetch(apiUrl);
      if(!res.ok) throw new Error("github api error");
      const data = await res.json();
      if(Array.isArray(data) && data[0] && data[0].commit){
        const d = new Date(data[0].commit.committer.date);
        const dateStr = d.getFullYear() + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getDate()).padStart(2,"0");
        localStorage.setItem(VERSION_CACHE_KEY, dateStr);
        el.textContent = `本檔案由 Faye 設計製作，請勿公開使用　${dateStr}`;
      } else {
        throw new Error("no commit data");
      }
    }catch(e){
      const cached = localStorage.getItem(VERSION_CACHE_KEY);
      el.textContent = cached
        ? `本檔案由 Faye 設計製作，請勿公開使用　${cached}`
        : `本檔案由 Faye 設計製作，請勿公開使用`;
    }
  }
  loadVersionDate();

  render();
})();
</script>
</body>
